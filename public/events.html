<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events — Nassr Writes</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Radley:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
</head>
<body>
    <nav id="navbar"></nav>

    <div class="page-hero fade-in">
        <span class="page-hero-label">Curatorial Practice</span>
        <h1 class="page-hero-title">Intentional Experiences</h1>
        <p class="page-hero-subtitle" id="eventsIntro"></p>
    </div>

    <section id="events">
        <div class="events-grid" id="eventsGrid"></div>
    </section>

    <section id="eventsGallerySection" class="events-gallery" style="display:none">
        <div class="section-header">
            <span class="section-label">Documentation</span>
            <h2 class="section-title">From Past Events</h2>
        </div>
        <div class="gallery-grid" id="galleryGrid"></div>
    </section>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <span class="lightbox-close" aria-label="Close">&times;</span>
        <figure class="lightbox-content" onclick="event.stopPropagation()">
            <img id="lightboxImg" src="" alt="">
            <figcaption id="lightboxCaption"></figcaption>
        </figure>
    </div>

    <footer id="footer"></footer>

    <script src="/components.js"></script>
    <script>
        function escHtml(s) {
            return String(s || '').replace(/[&<>"']/g, c =>
                ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }

        initPage(function (content) {
            document.getElementById('eventsIntro').textContent = content.events.intro;

            document.getElementById('eventsGrid').innerHTML = content.events.list.map(e => `
                <div class="event-card fade-in">
                    <div class="event-image">
                        ${e.imageUrl ? `<img src="${escHtml(e.imageUrl)}" alt="${escHtml(e.title)}">` : 'Documentary Photo'}
                    </div>
                    <div class="event-info">
                        <span class="event-meta">${escHtml(e.date)} · ${escHtml(e.venue)}</span>
                        <h3 class="event-title">${escHtml(e.title)}</h3>
                        <p class="event-description">${escHtml(e.description)}</p>
                    </div>
                </div>`).join('');

            const gallery = content.events.gallery || [];
            if (gallery.length) {
                document.getElementById('eventsGallerySection').style.display = '';
                document.getElementById('galleryGrid').innerHTML = gallery.map(g => `
                    <figure class="gallery-item fade-in"
                            onclick="openLightbox('${escHtml(g.url)}', '${escHtml(g.caption).replace(/'/g, "\\'")}')">
                        <img src="${escHtml(g.url)}" alt="${escHtml(g.caption || 'Past event')}" loading="lazy">
                        ${g.caption ? `<figcaption>${escHtml(g.caption)}</figcaption>` : ''}
                    </figure>`).join('');
            }
        });

        function openLightbox(url, caption) {
            document.getElementById('lightboxImg').src = url;
            document.getElementById('lightboxImg').alt = caption || 'Past event';
            document.getElementById('lightboxCaption').textContent = caption || '';
            document.getElementById('lightbox').classList.add('active');
        }
        function closeLightbox() {
            document.getElementById('lightbox').classList.remove('active');
        }
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });
    </script>
</body>
</html>
