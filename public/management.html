<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artist Management — Nassr Writes</title>
  <meta name="description" content="Long-term creative partnerships built on discernment, not hype. Strategy, positioning, and career architecture for independent artists.">
  <meta name="theme-color" content="#0D0C0A">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Artist Management — Nassr Writes">
  <meta property="og:description" content="Long-term creative partnerships built on discernment, not hype.">
  <link rel="alternate" type="application/rss+xml" title="Nassr Writes" href="/feed.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400..700,0..100,0..1&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav id="navbar" aria-label="Primary"></nav>

  <main id="main">
    <header class="page-hero">
      <div class="container">
        <p class="page-eyebrow fade-in">The Practice — II</p>
        <h1 class="page-title fade-in" style="--fade-delay:80ms">Artist<br><em>Management.</em></h1>
        <p class="page-intro fade-in" style="--fade-delay:160ms" id="managementPhilosophy"></p>
      </div>
    </header>

    <section class="services-section">
      <div class="container">
        <div class="section-head fade-in">
          <h2><em>Services</em></h2>
          <span class="meta">Four arrangements</span>
        </div>
        <div class="services-grid" id="servicesGrid"></div>
      </div>
    </section>

    <section class="fit-section">
      <div class="container">
        <div class="section-head fade-in">
          <h2>Is this <em>for you?</em></h2>
          <span class="meta">A short test</span>
        </div>
        <div class="fit-grid">
          <div class="fit-col fade-in">
            <h3>Yes, <em>if</em></h3>
            <ul id="forYouList"></ul>
          </div>
          <div class="fit-col no fade-in" style="--fade-delay:80ms">
            <h3>No, <em>if</em></h3>
            <ul id="notForYouList"></ul>
          </div>
        </div>

        <div class="fade-in" style="margin-top: var(--s-9); padding-top: var(--s-7); border-top: 1px solid var(--rule); text-align: center;">
          <p style="font-family: var(--font-display); font-style: italic; font-size: clamp(1.5rem, 3vw, 2rem); font-variation-settings: 'opsz' 96, 'SOFT' 100, 'WONK' 1; line-height: 1.32; color: var(--paper-strong); max-width: 36ch; margin: 0 auto var(--s-6);">
            If you're building something that matters, I'd welcome a conversation.
          </p>
          <a href="/contact" class="btn-primary">Get in touch →</a>
        </div>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>

  <script src="/components.js"></script>
  <script>
    initPage(function(content) {
      const mgmt = content.management || {};
      document.getElementById('managementPhilosophy').textContent = mgmt.philosophy || '';

      const sg = document.getElementById('servicesGrid');
      sg.innerHTML = (mgmt.services || []).map((s, i) => `
        <article class="service">
          <div class="service-num">${String(i + 1).padStart(2, '0')}</div>
          <h3 class="service-title">${s.title}</h3>
          <p class="service-desc">${s.description}</p>
        </article>
      `).join('');

      document.getElementById('forYouList').innerHTML = (mgmt.forYou || []).map(item => `<li>${item}</li>`).join('');
      document.getElementById('notForYouList').innerHTML = (mgmt.notForYou || []).map(item => `<li>${item}</li>`).join('');
    });
  </script>
</body>
</html>
