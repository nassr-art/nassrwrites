<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Writing — Nassr Writes</title>
  <meta name="description" content="Writing archive by category — Nassr Writes.">
  <meta name="theme-color" content="#0D0C0A">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Writing — Nassr Writes">
  <link rel="alternate" type="application/rss+xml" title="Nassr Writes" href="/feed.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,400..700,0..100,0..1;1,9..144,400..700,0..100,0..1&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <nav id="navbar" aria-label="Primary"></nav>

  <main id="main">
    <header class="page-hero">
      <div class="container">
        <p class="page-eyebrow fade-in">
          <a href="/writing" style="color:var(--paper-muted); border-bottom: 1px solid var(--rule-strong); transition: color var(--t-fast);">← Archive</a>
        </p>
        <h1 class="page-title fade-in" id="catPageTitle" style="--fade-delay:80ms"></h1>
        <p class="page-intro fade-in" id="catDescBody" style="--fade-delay:160ms"></p>
      </div>
    </header>

    <section class="archive-section">
      <div class="container">
        <div class="writing-list" id="writingList"></div>
      </div>
    </section>
  </main>

  <footer id="footer"></footer>

  <script src="/components.js"></script>
  <script>
    const pathParts = window.location.pathname.split('/').filter(Boolean);
    const currentCat = pathParts[pathParts.length - 1];

    initPage(function(content) {
      const cats = content.writingCategories || {};
      const catData = cats[currentCat];

      if (catData) {
        document.getElementById('catPageTitle').innerHTML = `<em>${catData.label}.</em>`;
        document.title = catData.label + ' — Nassr Writes';
        document.getElementById('catDescBody').textContent = catData.description || '';
      } else {
        document.getElementById('catPageTitle').textContent = 'Not found';
      }

      const writings = (content.writings || []).filter(w =>
        w.status !== 'draft' && (w.category || '').toLowerCase() === currentCat
      );

      const list = document.getElementById('writingList');
      if (!writings.length) {
        list.innerHTML = `<p style="color:var(--paper-faint); font-style:italic; padding: var(--s-7) 0;">No pieces in this category yet.</p>`;
        return;
      }
      list.innerHTML = writings.map(w => {
        const rt = w.readingTime || readingTime(w.fullContent || w.description || '');
        return `
          <article class="writing-item">
            <a class="writing-link" href="${w.link}">
              <span class="writing-date">${w.date || ''}</span>
              <div>
                <h3 class="writing-title">${w.title}${w.featured ? '<span class="writing-featured-flag" aria-label="Featured">✦</span>' : ''}</h3>
                <p class="writing-excerpt">${w.excerpt || w.description || ''}</p>
              </div>
              <span class="writing-read">${rt} min</span>
            </a>
          </article>`;
      }).join('');
    });
  </script>
</body>
</html>
